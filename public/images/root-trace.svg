<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <style>
    .line { stroke: #9aa4b5; stroke-width: 2; fill: none; }
    .node { fill: #ffffff; stroke: #2f6fde; stroke-width: 2; }
    .me { fill: #2f6fde; stroke: #2f6fde; stroke-width: 2; }
    .spouse { fill: #ffffff; stroke: #9aa4b5; stroke-width: 2; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #5c6475; }
      .node { fill: #19191c; stroke: #7aa7ff; }
      .me { fill: #7aa7ff; stroke: #7aa7ff; }
      .spouse { fill: #19191c; stroke: #5c6475; }
    }
  </style>
  <!-- 祖辈 -->
  <path class="line" d="M60 30 H100 M80 30 V58 M140 30 H180 M160 30 V58" />
  <!-- 父母 -->
  <path class="line" d="M80 58 H160 M120 58 V86" />
  <!-- 我这一辈 -->
  <path class="line" d="M80 86 H120 M80 86 V100 M120 86 V99 M131 110 H150" />
  <!-- 子女 -->
  <path class="line" d="M140 110 V137" />
  <circle class="node" cx="60" cy="30" r="10" />
  <circle class="node" cx="100" cy="30" r="10" />
  <circle class="node" cx="140" cy="30" r="10" />
  <circle class="node" cx="180" cy="30" r="10" />
  <circle class="node" cx="80" cy="58" r="10" />
  <circle class="node" cx="160" cy="58" r="10" />
  <circle class="node" cx="80" cy="110" r="10" />
  <circle class="me" cx="120" cy="110" r="11" />
  <circle class="spouse" cx="160" cy="110" r="10" />
  <circle class="node" cx="140" cy="146" r="9" />
</svg>
